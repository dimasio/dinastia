# Локальное окружение (скилл local-env). Только для разработки и CI — не для прода.
name: dinastia

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_OWNER_PASSWORD: app_owner
      APP_USER_PASSWORD: app_user
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dinastia"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=*
    ports:
      - "${S3_PORT:-8333}:8333"
      - "${S3_UI_PORT:-8888}:8888"
    volumes:
      - seaweedfs:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Одноразово создаёт бакет (идемпотентно): pnpm env:up запускает его через `compose run`.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    profiles: ["init"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-dinastia}
    command:
      - >-
        if echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 2>/dev/null | grep -qw "$${S3_BUCKET:-dinastia}";
        then echo "бакет $${S3_BUCKET:-dinastia} уже есть";
        else echo "s3.bucket.create -name $${S3_BUCKET:-dinastia}" | weed shell -master=seaweedfs:9333; fi

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
  seaweedfs:
