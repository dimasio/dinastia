# CI (скилл release-deploy): то же окружение, что локально (docker/compose.yml), и тот же критерий готовности —
# pnpm check + e2e. Красный CI — не мержить.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Зависимости
        run: pnpm install --frozen-lockfile

      - name: Окружение (Postgres, SeaweedFS, Mailpit)
        run: |
          cp .env.example .env
          pnpm env:up

      - name: Lint, типы, тесты, документация
        run: pnpm check

      - name: Миграции на чистой БД и демо-данные
        run: |
          pnpm db:reset
          pnpm db:seed

      - name: Аудит зависимостей (high и выше)
        run: pnpm audit --prod --audit-level high

      - name: Браузер для e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      # Последним: меняет рабочую копию (в CI она одноразовая). Генераторы не должны выдавать код, который не проходит проверки.
      - name: Генераторы выдают рабочий код
        run: |
          pnpm gen:module ci-probe --title "Проверка генератора"
          pnpm gen:resource schools ci-probe --row StaffMember --api members --perm schools.members.read
          pnpm typecheck
          pnpm lint
          pnpm --filter @dinastia/api test
          pnpm --filter @dinastia/web test

      - name: Артефакты упавших e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Логи окружения
        if: failure()
        run: docker compose -f docker/compose.yml --env-file .env logs --tail=200
